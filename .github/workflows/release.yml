# Publishes the addon to CurseForge (and GitHub Releases).
#
# Two ways to release:
#   1. Push to the `release` branch: this job reads "## Version:" from
#      TapCatForever.toc, creates the matching tag (e.g. v1.1.0) and publishes.
#   2. Push a tag like v1.1.0 yourself.
#
# Needs repository secret CF_API_KEY and "## X-Curse-Project-ID" in the TOC.
name: Release

on:
  push:
    branches: [ release ]
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the version from the TOC
        if: github.ref_type == 'branch'
        run: |
          VERSION=$(grep -m1 '^## Version:' TapCatForever.toc | awk '{print $3}' | tr -d '\r')
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Bump '## Version:' in TapCatForever.toc before releasing."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "TapCatForever ${VERSION}"
          git push origin "${TAG}"
          echo "Tagged ${TAG}"

      - uses: BigWigsMods/packager@v2
